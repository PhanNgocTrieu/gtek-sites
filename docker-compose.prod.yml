# GTek website — production-like stack.
#
#   ./docker/up-prod.sh
#
# NEXT_PUBLIC_* vars are baked in at image build time. Rebuild after changing them:
#   docker compose -f docker-compose.prod.yml --env-file .env.local up --build -d

name: gtek-sites-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET}
        NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-2024-01-01}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    image: gtek-sites:prod
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Secrets stay in env_file. Repeating them as ${VAR:-} overrides env_file
    # with an empty string when Compose interpolation does not see the var
    # (for example `docker compose up` without `--env-file .env.local`).
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
